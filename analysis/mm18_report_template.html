<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moral Machines, 18 Models</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --card: #ffffff; --ink: #0b0b0b; --muted: #52514e; --line: #e4e3df;
    --accent: #2a78d6; --accent-soft: #eef4fc; --mark: #fde8a8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--surface);
           border-bottom: 1px solid var(--line); padding: 12px 16px 0; }
  header h1 { font-size: 18px; margin: 0 0 8px; }
  nav { display: flex; gap: 4px; overflow-x: auto; }
  nav button { font: inherit; background: none; border: 0; border-bottom: 2px solid transparent;
               padding: 8px 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  section.tab { scroll-margin-top: 120px; }
  main { max-width: 1120px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 17px; margin: 32px 0 4px; }
  h3 { font-size: 16px; margin: 0 0 4px; }
  h4 { font-size: 13px; margin: 16px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .explain { color: var(--muted); max-width: 78ch; margin: 4px 0 8px; }
  .explain b, .explain strong { color: var(--ink); }
  .fig { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px; margin: 8px 0 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 12px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 28px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 13px; }
  ul.findings { max-width: 82ch; padding-left: 20px; }
  ul.findings li { margin: 6px 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; margin: 8px 0 12px; }
  .controls label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
  .controls select, .controls button { font: inherit; padding: 6px 8px; border: 1px solid var(--line);
                                       border-radius: 6px; background: var(--card); color: var(--ink); max-width: 100%; }
  .controls button { cursor: pointer; }
  #case-select { min-width: min(520px, 100%); }
  .case { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .meta { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .note { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 10px 12px; margin: 8px 0; border-radius: 0 6px 6px 0; }
  .verdict { margin: 8px 0; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .scenario { white-space: pre-wrap; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line);
              border-radius: 6px; padding: 10px; margin: 0; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  table { border-collapse: collapse; font-size: 14px; margin: 4px 0; }
  th, td { text-align: left; padding: 4px 14px 4px 0; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  details { margin: 8px 0; }
  .table-scroll { overflow-x: auto; max-width: 100%; }
  .eg-yes { font-weight: 600; }
  .label-box { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; background: var(--accent-soft);
               border-radius: 6px; padding: 10px 12px; margin: 12px 0; }
  .label-box label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; flex: 1 1 220px; }
  .label-box select, .label-box textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
                                           background: var(--card); color: var(--ink); width: 100%; }
  .label-box textarea { min-height: 60px; resize: vertical; }
  .saved { font-size: 12px; color: var(--muted); }
  .tag-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; margin: 8px 0; }
  .tag-grid .f b { display: block; } .tag-grid .f span { font-size: 12px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { padding: 5px 10px; font-size: 13px; cursor: pointer; border-left: 1px solid var(--line); color: var(--muted); }
  .seg label:first-of-type { border-left: 0; }
  .seg input:checked + label { background: var(--accent); color: #fff; }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (max-width: 760px) { .tag-grid { grid-template-columns: minmax(0, 1fr); } }
  .cv-box { flex-direction: column; align-items: stretch; }
  .cv-q { display: flex; flex-direction: column; gap: 4px; }
  .label-box .cv-seg label { display: inline-block; flex: none; font-size: 14px; padding: 7px 14px; color: var(--muted); }
  .label-box .cv-seg input:checked + label { color: #fff; }
  kbd { font: 11px ui-monospace, monospace; opacity: .7; margin-left: 4px; }
  summary { cursor: pointer; color: var(--accent); }
  details pre, details p { white-space: pre-wrap; font-size: 13.5px; }
</style>
</head>
<body>
<header>
  <h1>Moral Machines: the paper's 18 reference models</h1>
  <nav role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button role="tab" data-tab="drivers" aria-selected="false">What drives low MM NSG</button>
    <button role="tab" data-tab="misleading" aria-selected="false">Misleading explanations</button>
    <button role="tab" data-tab="shared" aria-selected="false">Shared failures</button>
    <button role="tab" data-tab="tagging" aria-selected="false">Tag explanations</button>
    <button role="tab" data-tab="rule" aria-selected="false">Decision rule</button>
    <button role="tab" data-tab="experiments" aria-selected="false">Experiments</button>
  </nav>
</header>
<main>
  <section class="tab" id="overview">__OVERVIEW__</section>
  <section class="tab" id="drivers" hidden>__DRIVERS__</section>
  <section class="tab" id="misleading" hidden>__MISLEADING__</section>
  <section class="tab" id="shared" hidden>__SHARED__</section>
  <section class="tab" id="tagging" hidden>__TAGGING__</section>
  <section class="tab" id="rule" hidden>__RULE__</section>
  <section class="tab" id="experiments" hidden>__EXP__</section>
</main>
<script>const PAIRS_BY_VIEW = __PAIRS__;
const EXPL = __EXPL__;
const MISLED = __MISLED__;
const TAGS = __TAGS__;
const COVER = __COVER__;
const REPAIR = __REPAIR__;
const FACTORS = __FACTORS__;</script>
<script>
// ---- tabs ----
function showTab(name) {
  document.querySelectorAll("section.tab").forEach(s => s.hidden = s.id !== name);
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  window.dispatchEvent(new Event("resize"));  // plotly figures drawn while hidden need a resize
  try { localStorage.setItem("mm18-tab", name); } catch (e) {}
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
{
  let t = location.hash.slice(1);
  try { t = t || localStorage.getItem("mm18-tab"); } catch (e) {}
  if (t && document.getElementById(t)) showTab(t);
}
const $ = id => document.getElementById(id);
function fill(sel, values, allLabel) {
  sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option>${v}</option>`).join("");
}
function loadLabels(key) { try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { return {}; } }
function saveLabels(key, labels) { try { localStorage.setItem(key, JSON.stringify(labels)); return true; } catch (e) { return false; } }
function downloadCsv(name, head, rows) {
  const esc = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([[head.join(",")].concat(rows.map(r => r.map(esc).join(","))).join("\n")], { type: "text/csv" }));
  a.download = name;
  a.click();
}
function labelBox(prefix, verdicts, lab, placeholder) {
  return `<div class="label-box">
    <label>Your verdict<select id="${prefix}-verdict">${verdicts.map(v => `<option${v === (lab.verdict || "") ? " selected" : ""}>${v}</option>`).join("")}</select></label>
    <label>Notes<textarea id="${prefix}-notes" placeholder="${placeholder}">${lab.notes || ""}</textarea></label>
    <span class="saved" id="${prefix}-saved"></span></div>`;
}
function wireLabel(prefix, key, labels, id, select, i) {
  const store = () => {
    labels[id] = { verdict: $(prefix + "-verdict").value, notes: $(prefix + "-notes").value };
    $(prefix + "-saved").textContent = saveLabels(key, labels) ? "saved in this browser" : "couldn't save (storage blocked): download before leaving";
    const opt = select.options[i];
    if (opt) opt.textContent = (labels[id].verdict ? "✓ " : "") + opt.textContent.replace(/^✓ /, "");
  };
  $(prefix + "-verdict").addEventListener("change", store);
  $(prefix + "-notes").addEventListener("input", store);
}

// ---- explanation-misled browser ----
if ($("m-view")) {
  const KEY = "mm-misled-labels";  // same key as the earlier report, so saved labels carry over
  const VERDICTS = ["", "stated principle violated", "overstated factor", "hidden cause", "near-tie", "predictor misread",
                    "pair problem", "mixed", "unsure"];
  const labels = loadLabels(KEY);
  const uniq = k => [...new Set(MISLED.map(r => r[k]))];
  fill($("m-model"), uniq("model"), "All models");
  fill($("m-dir"), uniq("direction").sort(), "Both directions");
  fill($("m-change"), uniq("change").sort(), "Any change");
  let rows = [];
  const ok = (a, r) => a === r.a_cf ? "✓ right" : "✗ wrong";
  function apply() {
    const g = $("m-group").value, m = $("m-model").value, dr = $("m-dir").value, ch = $("m-change").value;
    rows = MISLED.filter(r => (!g || r.group === g) && (!m || r.model === m) && (!dr || r.direction === dr) && (!ch || r.change === ch));
    $("m-select").innerHTML = rows.map((r, i) => `<option value="${i}">${labels[r.id] && labels[r.id].verdict ? "✓ " : ""}` +
      `${r.model} · ${r.change} · pair ${r.o}→${r.c}</option>`).join("");
    $("m-count").textContent = `${rows.length} of ${MISLED.length}`;
    render(0);
  }
  function render(i) {
    const r = rows[i];
    if (!r) { $("m-view").innerHTML = "<p class='explain'>No rows match these filters.</p>"; return; }
    $("m-select").value = i;
    $("m-view").innerHTML = `<div class="case">
      <h3>${r.model} <span class="meta">(${r.group})</span></h3>
      <p class="meta">Pair ${r.o} → ${r.c} · what changed: <b>${r.change}</b> · dimension: ${r.dim} · ${r.fmt}</p>
      <p class="verdict">The model answered <b>${r.a_orig}</b> on the original and <b>${r.a_cf}</b> on the counterfactual, so
        the explanation <b>${r.direction}</b>. Without the explanation <b>${r.rwo} of ${r.n}</b> predictors were right; with it,
        <b>${r.rw} of ${r.n}</b>.</p>
      <div class="cols"><div><h4>Original scenario</h4><pre class="scenario">${r.orig_html}</pre></div>
        <div><h4>Counterfactual scenario</h4><pre class="scenario">${r.cf_html}</pre></div></div>
      ${labelBox("m", VERDICTS, labels[r.id] || {}, "Which sentence misled the predictors? What did the model actually do?")}
      <h4>Explanation the predictors saw (original scenario; they also saw the factors list below)</h4><p>${r.expl}</p>
      <p class="meta">Most important factors: ${r.factors || "—"}</p>
      <h4>Predictor answers on the counterfactual (correct answer: ${r.a_cf})</h4>
      <div class="table-scroll"><table><thead><tr><th>Predictor</th><th>Without explanation</th><th>With explanation</th></tr></thead><tbody>
        ${r.preds.map(p => `<tr><td>${p[0]}</td><td>${p[2]} · ${ok(p[2], r)}</td><td>${p[1]} · ${ok(p[1], r)}</td></tr>`).join("")}
      </tbody></table></div>
      <details><summary>The model's own explanation on the counterfactual (not shown to predictors)</summary><p>${r.cf_expl}</p></details>
      ${r.cot ? `<details><summary>${r.cot_by}'s reasoning with the explanation (truncated)</summary><pre>${r.cot}</pre></details>` : ""}
    </div>`;
    wireLabel("m", KEY, labels, r.id, $("m-select"), i);
  }
  ["m-group", "m-model", "m-dir", "m-change"].forEach(id => $(id).addEventListener("change", apply));
  window.openMisled = id => {  // used by the tagging tab
    showTab("misleading");
    ["m-group", "m-model", "m-dir", "m-change"].forEach(k => $(k).value = "");
    apply();
    const i = rows.findIndex(r => r.id === id);
    if (i >= 0) render(i);
    $("m-view").scrollIntoView({ block: "start" });
  };
  $("m-select").addEventListener("change", e => render(+e.target.value));
  $("m-prev").addEventListener("click", () => render(Math.max(0, +$("m-select").value - 1)));
  $("m-next").addEventListener("click", () => render(Math.min(rows.length - 1, +$("m-select").value + 1)));
  $("m-download").addEventListener("click", () => downloadCsv("mm18_explanation_misled_labels.csv",
    ["group", "model", "original_idx", "counterfactual_idx", "what_changed", "dimension", "direction", "right_without", "verdict", "notes"],
    MISLED.map(r => [r.group, r.model, r.o, r.c, r.change, r.dim, r.direction, r.rwo, (labels[r.id] || {}).verdict, (labels[r.id] || {}).notes])));
  apply();
}

// ---- shared-failure browser ----
if ($("pair-view")) {
  const KEY = "mm-shared-labels";  // same key as the earlier report, so saved labels carry over
  const VERDICTS = ["", "shared unfaithfulness", "near-tie / indifference", "predictor error", "pair problem", "position bias",
                    "mixed", "unsure"];
  const labels = loadLabels(KEY);
  const pct = v => Math.round(v * 100) + "%";
  let PAIRS = [], shown = [];
  function setView(v) {
    document.querySelectorAll(".shared-view").forEach(d => d.hidden = d.dataset.view !== v);
    window.dispatchEvent(new Event("resize"));
    PAIRS = PAIRS_BY_VIEW[v] || [];
    try { localStorage.setItem("mm18-shared-view", v); } catch (e) {}
    apply();
  }
  function apply() {
    const f = $("pair-filter").value;
    shown = PAIRS.filter(p => !f || (f === "unlabelled" ? !(labels[p.id] && labels[p.id].verdict)
                                 : f === "other" ? p.change !== "counts only" : p.change === f));
    $("pair-select").innerHTML = shown.map((p, i) => `<option value="${i}">${labels[p.id] && labels[p.id].verdict ? "✓ " : ""}` +
      `${p.o}→${p.c} · ${p.dim} · ${p.change} · ${p.n_eg}/${p.n_models} models</option>`).join("");
    $("pair-count").textContent = `${shown.length} of ${PAIRS.length}`;
    render(0);
  }
  function render(i) {
    const p = shown[i];
    if (!p) { $("pair-view").innerHTML = "<p class='explain'>No pairs match this filter.</p>"; return; }
    $("pair-select").value = i;
    $("pair-view").innerHTML = `<div class="case">
      <h3>Pair ${p.o} → ${p.c}</h3>
      <p class="meta">Dimension: <b>${p.dim}</b> · what changed: <b>${p.change}</b> · egregious for <b>${p.n_eg} of ${p.n_models}</b>
        models · <b>${p.n_flip} of ${p.n_models}</b> flipped their answer · predictor answers wrong: <b>${pct(p.wrong_with)}</b>
        with the explanation, ${pct(p.wrong_without)} without</p>
      <div class="cols"><div><h4>Original scenario</h4><pre class="scenario">${p.orig_html}</pre></div>
        <div><h4>Counterfactual scenario</h4><pre class="scenario">${p.cf_html}</pre></div></div>
      ${labelBox("lab", VERDICTS, labels[p.id] || {}, "Which principle, which models, what to resample…")}
      <h4>Each model on this pair (egregious rows first)</h4>
      <div class="table-scroll"><table><thead><tr><th>Model</th><th>Group</th><th>Original → counterfactual</th>
        <th>Predictors right with explanation</th><th>…without</th><th></th></tr></thead><tbody>
        ${p.rows.map(r => `<tr><td>${r.model}</td><td>${r.group}</td><td>${r.a_orig} → ${r.a_cf} ${r.a_orig !== r.a_cf ? "(flipped)" : "(kept)"}</td>
          <td>${r.rw} of ${r.n}</td><td>${r.rwo} of ${r.n}</td><td class="eg-yes">${r.eg ? "✗ egregious" : ""}</td></tr>`).join("")}
      </tbody></table></div>
      <h4>Explanations (original scenario; the predictors saw these)</h4>
      ${p.rows.map(r => { const [expl, factors, conf, cf] = EXPL[r.k] || ["", "", "", ""];
        return `<details${r.eg ? " open" : ""}><summary>${r.model}: answered ${r.a_orig}, then ${r.a_cf}${r.eg ? " · egregious" : ""}</summary>
          <p>${expl}</p><p class="meta">Most important factors: ${factors || "—"} · stated confidence: ${conf || "—"}</p>
          <p class="meta"><b>Its explanation on the counterfactual (not shown to predictors):</b> ${cf}</p></details>`; }).join("")}
    </div>`;
    wireLabel("lab", KEY, labels, p.id, $("pair-select"), i);
  }
  $("pair-filter").addEventListener("change", apply);
  window.openSharedPair = pid => {  // used by the tagging tab
    const v = Object.keys(PAIRS_BY_VIEW).find(k => PAIRS_BY_VIEW[k].some(p => p.id === pid));
    if (!v) return;
    showTab("shared");
    $("shared-view").value = v;
    $("pair-filter").value = "";
    setView(v);
    const i = shown.findIndex(p => p.id === pid);
    if (i >= 0) render(i);
    $("pair-view").scrollIntoView({ block: "start" });
  };
  $("pair-select").addEventListener("change", e => render(+e.target.value));
  $("pair-prev").addEventListener("click", () => render(Math.max(0, +$("pair-select").value - 1)));
  $("pair-next").addEventListener("click", () => render(Math.min(shown.length - 1, +$("pair-select").value + 1)));
  $("pair-download").addEventListener("click", () => {
    const all = new Map();
    Object.values(PAIRS_BY_VIEW).flat().forEach(p => all.set(p.id, p));
    downloadCsv("mm18_shared_failure_labels.csv",
      ["pair_id", "original_idx", "counterfactual_idx", "dimension", "what_changed", "n_egregious", "n_models", "verdict", "notes"],
      [...all.values()].map(p => [p.id, p.o, p.c, p.dim, p.change, p.n_eg, p.n_models, (labels[p.id] || {}).verdict, (labels[p.id] || {}).notes]));
  });
  $("shared-view").addEventListener("change", e => setView(e.target.value));
  let v0 = $("shared-view").value;
  try { const s = localStorage.getItem("mm18-shared-view"); if (s && PAIRS_BY_VIEW[s]) v0 = s; } catch (e) {}
  $("shared-view").value = v0;
  setView(v0);
}
// ---- Gate 2a: is the keyword "cited" label right? ----
if ($("rp-view")) {
  const KEY = "mm18-repair-check";
  const OPTS = [["yes", "Yes, it cites it"], ["no", "No"], ["unclear", "Unclear"]];
  const labels = loadLabels(KEY);
  let cur = 0;
  const fillSel = () => {
    $("rp-select").innerHTML = REPAIR.map((t, i) => `<option value="${i}">${labels[t.id] ? "✓ " : ""}#${t.n} · ${t.model} · ${t.factor}</option>`).join("");
    $("rp-count").textContent = `${REPAIR.length}`;
    $("rp-progress").textContent = `${REPAIR.filter(t => labels[t.id]).length} of ${REPAIR.length} done`;
  };
  function render(i) {
    const t = REPAIR[i]; if (!t) return;
    cur = i; $("rp-select").value = i;
    $("rp-view").innerHTML = `<div class="case">
      <h3>#${t.n} · ${t.model} · the counterfactual changes: <b>${t.factor}</b></h3>
      <div class="cols"><div><h4>Original (its explanation is the one shown)</h4><pre class="scenario">${t.orig_html}</pre></div>
        <div><h4>Counterfactual</h4><pre class="scenario">${t.cf_html}</pre></div></div>
      <h4>The original's "most important factors" list</h4><p>• ${t.factors}</p>
      <p class="meta">Keyword match found: ${t.keywords || "—"}</p>
      <div class="label-box cv-box"><div class="cv-q"><b>Does this list cite <i>${t.factor}</i>?</b>
        <div class="seg cv-seg" role="radiogroup">${OPTS.map(([v, txt], k) => `
          <input type="radio" name="rp-a" id="rp-a-${k}" value="${v}" ${labels[t.id] === v ? "checked" : ""}>
          <label for="rp-a-${k}">${txt} <kbd>${k + 1}</kbd></label>`).join("")}</div></div>
        <span class="saved" id="rp-saved"></span></div></div>`;
    $("rp-view").querySelectorAll("input[name=rp-a]").forEach(r => r.addEventListener("change", () => {
      labels[t.id] = r.value;
      $("rp-saved").textContent = saveLabels(KEY, labels) ? "saved" : "couldn't save (storage blocked): download before leaving";
      fillSel(); $("rp-select").value = cur;
    }));
  }
  const go = d => render(Math.max(0, Math.min(REPAIR.length - 1, cur + d)));
  window.kbTarget = "rp";  // keyboard goes to the section clicked last; this check by default
  ["rp-view", "rp-select", "rp-prev", "rp-next"].forEach(id => $(id).addEventListener("click", () => window.kbTarget = "rp"));
  document.addEventListener("keydown", e => {
    if (window.kbTarget !== "rp" || $("tagging").hidden || ["TEXTAREA", "SELECT", "INPUT"].includes(e.target.tagName) && e.target.type !== "radio") return;
    const k = e.key.toLowerCase();
    if (k === "arrowright" || k === "enter") { e.preventDefault(); go(1); return; }
    if (k === "arrowleft") { e.preventDefault(); go(-1); return; }
    const j = ["1", "2", "3"].indexOf(k);
    if (j >= 0) { const r = $(`rp-a-${j}`); if (r) { r.checked = true; r.dispatchEvent(new Event("change")); } }
  });
  $("rp-select").addEventListener("change", e => render(+e.target.value));
  $("rp-prev").addEventListener("click", () => go(-1));
  $("rp-next").addEventListener("click", () => go(1));
  $("rp-download").addEventListener("click", () => downloadCsv("mm18_repair_check_labels.csv",
    ["id", "model", "original_idx", "counterfactual_idx", "changed_factor", "keywords", "your_label"],
    REPAIR.map(t => [t.id, t.model, t.o, t.c, t.factor, t.keywords, labels[t.id] || ""])));
  fillSel(); render(0);
}
// ---- coverage sample: two one-click questions per row ----
if ($("cv-view")) {
  const KEY = "mm18-coverage-labels-v2", OLD_KEY = "mm18-coverage-labels";
  const QB = { key: "predict", keys: ["1", "2", "3"], q: "Following the explanation, which case would the model pick in the counterfactual?",
    opts: [["CASE 1", "Case 1", ""], ["CASE 2", "Case 2", ""], ["can't tell", "Can't tell", "the explanation doesn't settle it"]] };
  const CHANGE = { "counts only": "only the number of characters changed",
    "side swapped": "the two groups swapped places",
    "light swapped": "the traffic lights flipped (legal ↔ illegal crossers)",
    "light + side swapped": "the groups swapped places and the lights flipped",
    "dimension changed": "the kinds of characters changed (different theme)" };
  const labels = loadLabels(KEY);
  // carry over answers from the earlier, longer form
  const old = loadLabels(OLD_KEY), oldScope = s => !s ? "" : s.startsWith("yes") ? "yes" : s.startsWith("only") ? "partly" : s.startsWith("no") ? "no" : "";
  Object.entries(old).forEach(([id, l]) => { if (!labels[id]) labels[id] = { scope: oldScope(l.scope),
    predict: l.predict === "doesn't determine it" ? "can't tell" : (l.predict || ""), notes: l.notes || "",
    ...Object.fromEntries(FACTORS.map(([k]) => [k, l[k]]).filter(([, v]) => v && v !== "0")) }; });
  const FOPTS = [["1", "reason"], ["-1", "says irrelevant"], ["?", "unclear"]];
  const done = t => { const l = labels[t.id]; return !!(l && l.predict); };
  const ok = (a, r) => a === r.a_cf ? "✓" : "✗";
  let rows = [], cur = 0;
  function progress() { $("cv-progress").textContent = `${COVER.filter(done).length} of ${COVER.length} done`; }
  function apply() {
    const m = $("cv-model").value, f = $("cv-filter").value;
    rows = COVER.filter(t => (!m || t.model === m) && (!f || (f === "todo" ? !done(t) : done(t))));
    $("cv-select").innerHTML = rows.map((t, i) => `<option value="${i}">${done(t) ? "✓ " : ""}#${t.n} · ${t.model} · pair ${t.o}→${t.c}</option>`).join("");
    $("cv-count").textContent = `${rows.length} of ${COVER.length}`;
    progress();
    render(0);
  }
  const seg = (Q, v) => `<div class="cv-q"><b>${Q.q}</b><div class="seg cv-seg" role="radiogroup">${Q.opts.map(([val, txt, hint], k) => `
      <input type="radio" name="cv-${Q.key}" id="cv-${Q.key}-${k}" value="${val}" ${v === val ? "checked" : ""}>
      <label for="cv-${Q.key}-${k}" title="${hint}">${txt} <kbd>${Q.keys[k].toUpperCase()}</kbd></label>`).join("")}</div>
      <span class="meta">${Q.opts.filter(o => o[2]).map(o => `<b>${o[1]}</b>: ${o[2]}`).join(" · ")}</span></div>`;
  function render(i) {
    const t = rows[i];
    if (!t) { $("cv-view").innerHTML = "<p class='explain'>Nothing matches this filter.</p>"; return; }
    cur = i;
    $("cv-select").value = i;
    const l = labels[t.id] || {};
    $("cv-view").innerHTML = `<div class="case">
      <h3>#${t.n} · ${t.model} chose <b>${t.a_orig}</b> on the original</h3>
      <p class="meta">What changed: <b>${CHANGE[t.change] || t.change}</b></p>
      <div class="cols"><div><h4>Original</h4><pre class="scenario">${t.orig_html}</pre></div>
        <div><h4>Counterfactual</h4><pre class="scenario">${t.cf_html}</pre></div></div>
      <h4>The model's explanation (original)</h4><p>${t.expl}</p>
      <p class="meta">Its most important factors: ${t.factors || "—"}</p>
      <h4>Which factors does the explanation cite? Click only the ones it uses; leave the rest blank (blank = not used, click again to clear)</h4>
      <div class="tag-grid">${FACTORS.map(([k, name, hint]) => `
        <div class="f"><b>${name}</b><span>${hint}</span></div>
        <div class="seg" role="radiogroup" aria-label="${name}">${FOPTS.map(([v, txt]) => `
          <input type="radio" name="cv-f-${k}" id="cv-f-${k}-${v}" value="${v}" ${l[k] === v ? "checked" : ""}>
          <label for="cv-f-${k}-${v}">${txt}</label>`).join("")}</div>`).join("")}
      </div>
      <div class="label-box cv-box">${seg(QB, l.predict)}
        <label>Notes (optional)<textarea id="cv-notes" placeholder="Anything odd about this row?">${l.notes || ""}</textarea></label>
        <span class="saved" id="cv-saved"></span></div>
      <div id="cv-outcome"></div></div>`;
    showOutcome(t);
    const store = () => {
      const c = { notes: $("cv-notes").value, scope: (labels[t.id] || {}).scope || "" };  // scope: kept from the earlier form, unused
      [QB].forEach(Q => { const x = document.querySelector(`input[name="cv-${Q.key}"]:checked`); c[Q.key] = x ? x.value : ""; });
      FACTORS.forEach(([k]) => { const x = document.querySelector(`input[name="cv-f-${k}"]:checked`); if (x) c[k] = x.value; });
      labels[t.id] = c;
      $("cv-saved").textContent = saveLabels(KEY, labels) ? "saved" : "couldn't save (storage blocked): download before leaving";
      const opt = $("cv-select").options[i];
      if (opt) opt.textContent = (done(t) ? "✓ " : "") + opt.textContent.replace(/^✓ /, "");
      progress();
      showOutcome(t);
    };
    $("cv-view").querySelectorAll("input[type=radio]").forEach(r => r.addEventListener("change", store));
    $("cv-view").querySelectorAll("input[name^='cv-f-']").forEach(r => {
      r.dataset.was = r.checked ? "1" : "";
      r.addEventListener("click", () => {
        if (r.dataset.was) { r.checked = false; store(); }
        document.querySelectorAll(`input[name="${r.name}"]`).forEach(x => x.dataset.was = x.checked ? "1" : "");
      });
    });
    $("cv-notes").addEventListener("input", store);
  }
  function showOutcome(t) {  // only after both questions are answered, so the outcome can't colour the answers
    const l = labels[t.id] || {};
    $("cv-outcome").innerHTML = !done(t) ? "<p class='meta'>Answer the question to see what actually happened.</p>" : `
      <details><summary>What actually happened</summary>
        <p class="verdict">On the counterfactual the model chose <b>${t.a_cf}</b> (${t.a_orig === t.a_cf ? "same answer" : "it switched"}).
          ${l.predict !== "can't tell" ? `Your reading of the explanation was <b>${l.predict === t.a_cf ? "right" : "wrong"}</b>.` : ""}
          Predictors right: <b>${t.rw} of ${t.n_pred}</b> with the explanation, ${t.rwo} of ${t.n_pred} without.</p>
        <div class="table-scroll"><table><thead><tr><th>Predictor</th><th>Without</th><th>With</th></tr></thead><tbody>
          ${t.preds.map(p => `<tr><td>${p[0]}</td><td>${p[2]} ${ok(p[2], t)}</td><td>${p[1]} ${ok(p[1], t)}</td></tr>`).join("")}
        </tbody></table></div>
        <details><summary>The model's explanation on the counterfactual</summary><p>${t.cf_expl}</p></details>
      </details>`;
  }
  const go = d => render(Math.max(0, Math.min(rows.length - 1, cur + d)));
  ["cv-view", "cv-select", "cv-prev", "cv-next", "cv-model", "cv-filter"].forEach(id => $(id).addEventListener("click", () => window.kbTarget = "cv"));
  document.addEventListener("keydown", e => {
    if ((window.kbTarget || "cv") !== "cv" || $("tagging").hidden || ["TEXTAREA", "SELECT", "INPUT"].includes(e.target.tagName) && e.target.type !== "radio") return;
    const k = e.key.toLowerCase();
    if (k === "arrowright" || k === "enter") { e.preventDefault(); go(1); return; }
    if (k === "arrowleft") { e.preventDefault(); go(-1); return; }
    [QB].forEach(Q => { const j = Q.keys.indexOf(k); if (j >= 0) { const r = $(`cv-${Q.key}-${j}`); if (r) { r.checked = true; r.dispatchEvent(new Event("change")); } } });
  });
  $("cv-model").addEventListener("change", apply);
  $("cv-filter").addEventListener("change", apply);
  $("cv-select").addEventListener("change", e => render(+e.target.value));
  $("cv-prev").addEventListener("click", () => go(-1));
  $("cv-next").addEventListener("click", () => go(1));
  $("cv-download").addEventListener("click", () => downloadCsv("mm18_coverage_labels.csv",
    ["id", "n", "model", "original_idx", "counterfactual_idx", "what_changed", "dimension", "answer_original",
     "answer_counterfactual", "outcome", "egregious", "right_with", "right_without", "n_predictors",
     ...FACTORS.map(([k]) => "cites_" + k), "predict", "notes"],
    COVER.map(t => { const l = labels[t.id] || {}; return [t.id, t.n, t.model, t.o, t.c, t.change, t.dim, t.a_orig, t.a_cf,
      t.outcome, t.egregious, t.rw, t.rwo, t.n_pred,
      ...FACTORS.map(([k]) => !done(t) ? "" : ({ "1": "reason", "-1": "irrelevant", "?": "unclear" })[l[k]] || "not used"),
      l.predict, l.notes]; })));
  saveLabels(KEY, labels);
  apply();
}
// ---- explanation tagging ----
if ($("t-view")) {
  const KEY = "mm18-tag-labels";
  const OPTS = [["0", "not used"], ["1", "reason"], ["-1", "irrelevant"], ["?", "unclear"]];
  const labels = loadLabels(KEY);
  const done = t => { const l = labels[t.id]; return l && FACTORS.every(([k]) => l[k] != null); };
  let rows = [];
  function progress() {
    const inSet = TAGS.filter(t => t.set === $("t-set").value);
    $("t-progress").textContent = `${inSet.filter(done).length} of ${inSet.length} fully labelled in this set`;
  }
  const sharedIds = new Set(Object.values(PAIRS_BY_VIEW).flat().map(p => p.id));
  const misledRow = t => MISLED.find(r => r.model === t.model && r.o === t.o && r.c === t.c);
  function apply() {
    const f = $("t-filter").value, set = $("t-set").value;
    const inSet = TAGS.filter(t => t.set === set);
    rows = inSet.filter(t => !f || (f === "todo" ? !done(t) : done(t)));
    $("t-select").innerHTML = rows.map((t, i) => `<option value="${i}">${done(t) ? "✓ " : ""}#${t.n} · pair ${t.o}→${t.c} · ${t.model} · ${t.dim}</option>`).join("");
    $("t-count").textContent = `${rows.length} of ${inSet.length}`;
    progress();
    render(0);
  }
  function render(i) {
    const t = rows[i];
    if (!t) { $("t-view").innerHTML = "<p class='explain'>Nothing matches this filter.</p>"; return; }
    $("t-select").value = i;
    const l = labels[t.id] || {};
    $("t-view").innerHTML = `<div class="case">
      <h3>#${t.n} · pair ${t.o} → ${t.c} · ${t.model}</h3>
      <p class="meta">Theme: <b>${t.dim}</b> · stated confidence: ${t.conf || "—"}${t.why ? ` · in this set because: <b>${t.why}</b>` : ""}</p>
      ${(sharedIds.has(`${t.o}-${t.c}`) || misledRow(t)) ? `<div class="controls">
        ${sharedIds.has(`${t.o}-${t.c}`) ? `<button type="button" id="t-go-shared">Open this pair in Shared failures →</button>` : ""}
        ${misledRow(t) ? `<button type="button" id="t-go-misled">Open this row in Misleading explanations →</button>` : ""}
      </div>` : ""}
      <div class="cols">
        <div><h4>Scenario</h4><pre class="scenario">${t.scenario}</pre></div>
        <div><h4>The model chose ${t.answer}. Its explanation:</h4><p>${t.expl}</p>
          <p class="meta">Most important factors (the model's own list): ${t.factors || "—"}</p></div>
      </div>
      <h4>Which factors does it give as a reason?</h4>
      <div class="tag-grid">${FACTORS.map(([k, name, hint]) => `
        <div class="f"><b>${name}</b><span>${hint}</span></div>
        <div class="seg" role="radiogroup" aria-label="${name}">${OPTS.map(([v, txt]) => `
          <input type="radio" name="t-${k}" id="t-${k}-${v}" value="${v}" ${String(l[k]) === v ? "checked" : ""}>
          <label for="t-${k}-${v}">${txt}</label>`).join("")}</div>`).join("")}
      </div>
      <div class="label-box">
        <label>Other reasons it gives<textarea id="t-other" placeholder="e.g. the car's passengers accepted the risk">${l.other || ""}</textarea></label>
        <label>Notes<textarea id="t-notes" placeholder="Anything ambiguous?">${l.notes || ""}</textarea></label>
        <span class="saved" id="t-saved"></span>
      </div></div>`;
    const store = () => {
      const cur = { other: $("t-other").value, notes: $("t-notes").value };
      FACTORS.forEach(([k]) => { const c = document.querySelector(`input[name="t-${k}"]:checked`); if (c) cur[k] = c.value; });
      labels[t.id] = cur;
      $("t-saved").textContent = saveLabels(KEY, labels) ? "saved in this browser" : "couldn't save (storage blocked): download before leaving";
      const opt = $("t-select").options[i];
      if (opt) opt.textContent = (done(t) ? "✓ " : "") + opt.textContent.replace(/^✓ /, "");
      progress();
    };
    $("t-view").querySelectorAll("input[type=radio]").forEach(r => r.addEventListener("change", store));
    if ($("t-go-shared")) $("t-go-shared").addEventListener("click", () => window.openSharedPair(`${t.o}-${t.c}`));
    if ($("t-go-misled")) $("t-go-misled").addEventListener("click", () => window.openMisled(misledRow(t).id));
    $("t-other").addEventListener("input", store);
    $("t-notes").addEventListener("input", store);
  }
  $("t-filter").addEventListener("change", apply);
  $("t-set").addEventListener("change", apply);
  $("t-select").addEventListener("change", e => render(+e.target.value));
  $("t-prev").addEventListener("click", () => render(Math.max(0, +$("t-select").value - 1)));
  $("t-next").addEventListener("click", () => render(Math.min(rows.length - 1, +$("t-select").value + 1)));
  $("t-download").addEventListener("click", () => downloadCsv("mm18_tag_labels.csv",
    ["id", "set", "n", "model", "original_idx", "counterfactual_idx", "dimension", "answer", "why", ...FACTORS.map(([k]) => k), "other", "notes"],
    TAGS.map(t => { const l = labels[t.id] || {}; return [t.id, t.set, t.n, t.model, t.o, t.c, t.dim, t.answer, t.why,
      ...FACTORS.map(([k]) => l[k] ?? ""), l.other, l.notes]; })));
  apply();
}
</script>
</body>
</html>
